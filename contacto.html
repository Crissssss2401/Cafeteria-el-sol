<body>
<nav> <!-- Navegación -->

    <h1 class="destacado">Contacto de la cafeterias</h1>
    
    <p>este es otro parrafo</p>
    <p class="destacado">Contenido de la página de contacto en esta cafeteria</p>


    <form class="formulario" id="miformulario"> <!-- Un Div es un contenedor de información -->
   
        <h1>Envianos tus comentarios</h1>

        <label for="nombre">Ingrese su nombre:</label> <!--un label Es el que muestra la información de lo que se debe ingresar en el input-->
        <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" required> <!-- un input recibe la información -->
        
        <br>
        <label for="telefono">Ingrese su numero de Telefono:</label> <!--un label Es el que muestra la información de lo que se debe ingresar en el input-->
        <input type="number" id="telefono" name="telefono" placeholder="Ingrese su numero" required> <!-- un input recibe la información -->
        
        <br>
        <label for="correo">Ingrese su correo Electronico:</label> <!--un label Es el que muestra la información de lo que se debe ingresar en el input-->
        <input type="email" id="correo" name="correo" placeholder="Ingrese su correo" > <!-- un input recibe la información -->
        <br>
        <label for="mensaje">Ingrese su mensaje:</label> <!--un label Es el que muestra la información de lo que se debe ingresar en el input-->|
        <br>
        <textarea id="mensaje" name="mensaje" placeholder="Ingrese su mensaje"></textarea> <!-- un input recibe la información -->        
        <br>
        <button type="submit">Enviar</button> <!-- un button es un boton que envia la información -->
        <button type="reset">Limpiar</button> <!-- un button es un boton que limpia la información -->
   
      
       

    </form>
     <p id="respuesta" class="mensaje" aria-live="polite"> Respuesta: </p> <!-- este es un parrafo para mostrar la respuesta -->

    <script>

        const formulario = document.getElementById("miformulario");
        const campoNombre = document.getElementById("nombre");
        const campoMensaje = document.getElementById("mensaje");
        const respuesta = document.getElementById("respuesta");

        formulario.addEventListener("submit", function(evento){
            evento.preventDefault(); //previene el comportamiento por defecto del formulario

            const nombre = campoNombre.value.trim(); //recupera el valor del input con ID nombre y elimina los espacios en blanco
            const mensaje = campoMensaje.value.trim(); //recupera el valor del input con ID mensaje y elimina los espacios en blanco

            if(mensaje.length > 10){
                const saludo = "¡Hola, " + nombre + "!";
             respuesta.textContent = saludo + " Gracias por tu mensaje: " + mensaje; //muestra en el parrafo con ID respuesta el saludo y el mensaje
               
            }else{
             respuesta.textContent = "El mensaje debe tener al menos 10 caracteres."; //muestra en el parrafo con ID respuesta el mensaje de error
            }

          

        });


    </script>
