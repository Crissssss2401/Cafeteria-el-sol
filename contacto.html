<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="Stylesheet" href="styles.css">
   
</head>
<body>
<nav> <!-- Navegación -->
            <a href="index.html">Inicio de página</a>
            <a href="horarios.html">Horarios</a>
            <a href="informacion.html">Información</a>
    </nav>
    <h1 class="destacado">Contacto de la cafeterias</h1>
    
    <p>este es otro parrafo</p>
    <p class="destacado">Contenido de la página de contacto en esta cafeteria</p>


    <form class="formulario" id="contacto"> <!-- Un Div es un contenedor de información -->
   
        <h1>Contacta con Nosotros!</h1>

        <label for="nombre">Ingrese su nombre:</label> <!--un label Es el que muestra la información de lo que se debe ingresar en el input-->
        <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" required> <!-- un input recibe la información -->
        <br>
        <label for="telefono">Ingrese su numero de Telefono:</label> <!--un label Es el que muestra la información de lo que se debe ingresar en el input-->
        <input type="number" id="telefono" name="telefono" placeholder="Ingrese su numero" required> <!-- un input recibe la información -->
        <br>
        <label for="mensaje">Ingrese su mensaje:</label> <!--un label Es el que muestra la información de lo que se debe ingresar en el input-->|
        <br>
        <textarea id="mensaje" name="mensaje" placeholder="Ingrese su mensaje"></textarea> <!-- un input recibe la información -->        
        <br>
        <button type="submit">Enviar A WhatsApp</button> <!-- un button es un boton que envia la información -->    
        <p id="respuesta" class="WhatsApp" aria-live="polite"></p> <!-- este es un parrafo para mostrar la respuesta -->
    </form>
  
    <script>
        const formulario = document.getElementById("contacto");

        formulario.addEventListener("submit", function(evento){
       evento.preventDefault();

        const nombre = document.getElementById("nombre").value.trim();
        const telefono = document.getElementById("telefono").value.trim();
        const mensaje = document.getElementById("mensaje").value.trim();

        const texto = `Hola, soy ${nombre}
         Mi teléfono es ${telefono}
         ${mensaje}`;

    const mensajeCodificado =
    encodeURIComponent(texto); // Codifica el mensaje para que sea seguro para la URL

        const url = `https://wa.me/50259256913?text=${mensajeCodificado}`; // Crea la URL de WhatsApp con el mensaje codificado
       
        window.open(url, "_blank", "noopener"); // Abre la URL en una nueva pestaña de manera segura
        const estado = document.getElementById("respuesta"); // Obtiene el elemento donde se mostrará la respuesta
        estado.textContent = // Texto que se mostrará en el elemento de respuesta
        "Revisa y confirma tu mensaje";
        });

    </script>

</body>
</html>
